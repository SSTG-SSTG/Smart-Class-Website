<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pocket Class</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-nav { backdrop-filter: blur(12px); background: rgba(255, 255, 255, 0.8); }
        .lecture-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen">
    <!-- Navbar -->
    <nav class="glass-nav border-b border-slate-200 px-8 py-5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2 text-indigo-600">
            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L1 7l11 5 11-5-11-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            <h1 class="text-2xl font-black tracking-tight">Pocket Class</h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-1">Authenticated As</p>
                <p id="studentId" class="text-sm font-bold text-slate-800">---</p>
            </div>
            <button onclick="logout()" class="bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-600 px-5 py-2.5 rounded-xl font-bold text-xs transition-all uppercase tracking-widest border border-slate-200">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-8 py-12">
        <header class="mb-16">
            <h2 class="text-5xl font-black text-slate-900 mb-4 tracking-tighter">Your Learning Archive</h2>
            <p class="text-lg text-slate-500 font-medium max-w-2xl">Access high-quality screen recordings of your classroom lectures. Revise, learn, and excel at your own pace.</p>
        </header>

        <div id="lectureContainer" class="space-y-20">
            <!-- Lectures grouped by date -->
            <div class="flex flex-col items-center justify-center py-32 opacity-20">
                <svg class="w-20 h-20 mb-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <p class="text-xl font-bold uppercase tracking-widest">Establishing Cloud Sync...</p>
            </div>
        </div>
    </div>

    <script>
        const roll = localStorage.getItem('student_roll');
        if (!roll) window.location.href = 'index.html';
        document.getElementById('studentId').textContent = roll;

        const firebaseConfig = {
            apiKey: "AIzaSyB4bMSd9E_Y-5HQVxhkj0Lbe1Qc-tQId3Q",
            authDomain: "pocketclass-fe71b.firebaseapp.com",
            databaseURL: "https://pocketclass-fe71b-default-rtdb.firebaseio.com",
            projectId: "pocketclass-fe71b",
            storageBucket: "pocketclass-fe71b.firebasestorage.app",
            messagingSenderId: "200601694944",
            appId: "1:200601694944:android:47b17fe2cd9f398b7b1685"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const subjectColors = {
            'Tamil': 'bg-emerald-100 text-emerald-700 border-emerald-200',
            'English': 'bg-amber-100 text-amber-700 border-amber-200',
            'Web Application': 'bg-indigo-100 text-indigo-700 border-indigo-200',
            'RDBMS': 'bg-rose-100 text-rose-700 border-rose-200',
            'DS': 'bg-cyan-100 text-cyan-700 border-cyan-200',
            'default': 'bg-slate-100 text-slate-700 border-slate-200'
        };

        function fetchLectures() {
            database.ref('lectures').on('value', (snapshot) => {
                const lectures = snapshot.val();
                if (!lectures) {
                    document.getElementById('lectureContainer').innerHTML = `
                        <div class="text-center py-32 bg-white rounded-[3rem] border-4 border-dashed border-slate-100">
                            <p class="text-2xl font-black text-slate-300 uppercase tracking-widest">No lectures recorded yet.</p>
                        </div>`;
                    return;
                }

                const grouped = {};
                Object.values(lectures).reverse().forEach(lecture => {
                    const date = new Date(lecture.date).toLocaleDateString('en-US', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                    if (!grouped[date]) grouped[date] = [];
                    grouped[date].push(lecture);
                });

                renderLectures(grouped);
            });
        }

        function renderLectures(grouped) {
            const container = document.getElementById('lectureContainer');
            container.innerHTML = '';

            for (const [date, lectures] of Object.entries(grouped)) {
                let html = `
                    <div class="space-y-8">
                        <div class="flex items-center gap-6">
                            <h3 class="text-sm font-black text-indigo-500 uppercase tracking-[0.3em] whitespace-nowrap">${date}</h3>
                            <div class="h-[2px] bg-slate-200 flex-1 rounded-full opacity-50"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                `;

                lectures.forEach(lecture => {
                    const colorClass = subjectColors[lecture.subject] || subjectColors.default;
                    html += `
                        <div class="lecture-card bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_20px_50px_rgba(79,70,229,0.15)] transition-all duration-500 group cursor-pointer relative overflow-hidden"
                            onclick="playVideo('${lecture.videoUrl}', '${lecture.subject}')">

                            <div class="flex justify-between items-center mb-8">
                                <div class="${colorClass} px-4 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest border border-current opacity-80">${lecture.subject}</div>
                                <div class="flex items-center gap-1 text-slate-400 font-bold text-[10px] uppercase">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    ${lecture.startTime}
                                </div>
                            </div>

                            <h4 class="text-2xl font-extrabold text-slate-900 mb-2 leading-tight group-hover:text-indigo-600 transition-colors">${lecture.subject} Masterclass</h4>
                            <p class="text-slate-400 font-bold text-xs uppercase tracking-wider mb-8 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                                ${lecture.className} • Section ${lecture.section}
                            </p>

                            <div class="flex items-center justify-between pt-6 border-t border-slate-50">
                                <span class="text-indigo-600 font-black text-xs uppercase tracking-widest">Watch Recording</span>
                                <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                                    <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6V4z"></path></svg>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        function playVideo(url, subject) {
            localStorage.setItem('current_video_url', url);
            localStorage.setItem('current_video_subject', subject);
            window.location.href = 'player.html';
        }

        function logout() {
            localStorage.removeItem('student_roll');
            window.location.href = 'index.html';
        }

        fetchLectures();
    </script>
</body>
</html>
